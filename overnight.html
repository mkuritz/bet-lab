<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Overnight · Bet Lab</title>
<style>:root{--bg:#0b0f17;--panel:#121826;--panel2:#182033;--line:#243049;--txt:#e6ebf5;--mut:#8b97b0;--acc:#53e3a6;--acc2:#3fa9ff;--bad:#ff5d6c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}a{color:var(--acc2)}
.w{max-width:960px;margin:0 auto;padding:16px}header{margin-bottom:10px}.logo{font-weight:800;font-size:20px;color:var(--txt);text-decoration:none}.logo b{color:var(--acc)}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}h1{margin:0;font-size:22px}
.sub2{color:var(--mut);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;margin:2px 0 2px}.dt{color:var(--mut);font-weight:600}.ml{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 2px}.ml span{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px}.ml b{color:var(--acc)}.days{display:flex;gap:6px;flex-wrap:wrap}.days button{background:var(--panel2);border:1px solid var(--line);color:var(--mut);border-radius:999px;padding:5px 11px;font:600 12px system-ui;cursor:pointer}
.days button.on{background:var(--acc);color:#06120c;border-color:var(--acc)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}.hd h2{margin:0;font-size:16px}.rec{font-weight:800;font-size:15px}.rec small{color:var(--mut);font-weight:600;font-size:11px;margin-left:6px}
.r{display:grid;grid-template-columns:22px 1fr 150px 150px;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.r .ck{color:var(--acc);font-weight:900}.r .t b{font-weight:600}.sp{color:var(--mut);font-size:10px;font-weight:800;margin-right:5px}
.pr{font-variant-numeric:tabular-nums}.pr .us{color:var(--acc);font-weight:700}.pr .bk{color:var(--mut)}.st{font-variant-numeric:tabular-nums;text-align:right}
.lh{color:var(--mut);font-size:10px;text-transform:uppercase;font-weight:700;border-top:0}.none{color:var(--mut);font-size:13px;padding:6px 0}
@media(max-width:640px){.r{grid-template-columns:20px 1fr auto;row-gap:2px}.r .st{grid-column:2/4;text-align:left;color:var(--mut);font-size:12px}.lh{display:none}}
</style><link rel="stylesheet" href="nav.css"><script src="https://sportslabshq.com/sl/sl.js?v=7" defer></script></head>
<body><div class="w"><header><a class="logo" href="./">Bet <b>Lab</b></a></header>
<div class="top"><h1>🌙 Overnight</h1><span class="dt" id="dt"></span></div>
<div id="out"><div class="none">Loading…</div></div>
<div class="mut" style="color:var(--mut);font-size:11px;margin:18px 0">Not betting advice. 21+ only. 1-800-GAMBLER.<br>Bet Lab · A <a href="https://sportslabshq.com/">Sports Labs</a> Product · Property of Michael Kuritz</div></div>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),pc=x=>Math.round(x*100)+"%";
const row=(r,pr)=>`<div class="r"><span class="ck">✓</span><span class="t"><span class="sp">${esc(r.sport.toUpperCase())}</span><b>${esc(r.title)}</b></span><span class="pr">${pr}</span><span class="st">${esc(r.line||"Final")}</span></div>`;
const SP=[["nhl","🏒 NHL"],["cfb","🏈 CFB"],["nfl","🏈 NFL"],["mlb","⚾ MLB"],["soccer","⚽ Soccer"],["nba","🏀 NBA"]];
const row2=(r,pr)=>`<div class="r"><span class="ck">✓</span><span class="t"><b>${esc(r.title)}</b></span><span class="pr">${pr}</span><span class="st">${esc(r.line||"Final")}</span></div>`;
fetch("data/overnight.json?t="+Date.now()).then(r=>r.json()).then(O=>{
 $("dt").textContent=new Date(O.date+"T12:00:00Z").toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric",timeZone:"UTC"});
 const C=O.called||[],B=O.beat||[],M=O.most_likely||[],G=O.graded||{};let h="";
 for(const [k,lab] of SP){const c=C.filter(r=>r.sport==k),u=B.filter(r=>r.sport==k),m=k=="nhl"?M:[];
  if(!G[k]&&!c.length&&!u.length&&!m.length)continue;
  h+=`<div class="card"><div class="hd"><h2>${lab}</h2></div><div class="sub2">🎯 Called it</div>`;
  if(m.length)h+=`<div class="ml">${m.map(x=>`<span>${esc(x.label.replace("NHL Most likely · ","Top "+x.of+" "))} <b>${x.hit}/${x.of}</b></span>`).join("")}</div>`;
  h+=c.length?c.map(r=>row2(r,r.lab?`<span class="us">${esc(r.lab)}</span>`:r.rec?`<span class="us">⭐ Recommended</span> · <span class="bk">${r.price>0?"+"+r.price:r.price}</span>`:`<span class="us">Us ${pc(r.p)}</span>`)).join(""):`<div class="none">—</div>`;
  if(u.length)h+=`<div class="sub2" style="margin-top:8px">📉 Underdog</div>`+u.map(r=>row2(r,`<span class="bk">Book ${pc(r.imp)}</span> · <span class="us">Us ${pc(r.p)}</span>`)).join("");
  h+=`</div>`}
 $("out").innerHTML=h||'<div class="none">No graded picks last night.</div>'}).catch(()=>{$("out").innerHTML='<div class="none">Unavailable right now.</div>'});
</script><script src="https://sportslabshq.com/js/leads-config.js"></script><script src="https://sportslabshq.com/js/leads.js" data-product="Bet Lab"></script><script src="nav.js"></script></body></html>
