name: Grade All In Cousins picks
on:
  schedule:
    # primary 3:40 AM ET run is dispatched by the Cloudflare sl-scheduler; this is the backup
    - cron: "10 14 * * *"  # backup ~10:10 AM ET
    - cron: "*/30 16-23 * * 0,1,5"   # every 30 min in Thu/Sun/Mon NFL windows (UTC)
    - cron: "*/30 0-4 * * 1,2,5"     # late games past midnight UTC
  push:
    paths: ["data/allin_picks.json"]
  workflow_dispatch:
concurrency: { group: allin-grade, cancel-in-progress: false }
permissions: { contents: write }
jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/grade_allin.py
      - run: |
          git config user.name "sports-labs-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/allin_picks.json
          git diff --cached --quiet || (git commit -m "Grade All In Cousins picks" && git pull --rebase && git push)
