name: Update props

on:
  schedule:
    - cron: "0 10 * * *"            # daily full game-log refresh (~6 AM ET)
    - cron: "30 */3 * * *"          # props every 3h
    - cron: "15 * * * 0,1,4,5,6"    # hourly on game days (Thu/Sat/Sun/Mon ET; UTC days widened for evening games)
    - cron: "5 11-17 * * 0,6"       # soccer weekend mornings/afternoons ET (hourly ~7 AM-1 PM ET)
    - cron: "45 21-23,0-2 * * *"    # NHL/NBA/MLB evenings: hourly ~5:45-10:45 PM ET, when day-of skater/goalie lines post
  workflow_dispatch:
    inputs:
      full_logs:
        description: "Refresh every game log"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-props
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch props
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}   # optional placeholder; unused if absent
        run: |
          if [ "${{ github.event.schedule }}" = "0 10 * * *" ] || [ "${{ inputs.full_logs }}" = "true" ]; then
            python scripts/fetch_props.py --logs
          else
            python scripts/fetch_props.py
          fi
      - name: Commit if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898475+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet -- data/ ':!data/meta.json'; then
            echo "No data changes"; exit 0
          fi
          git commit -m "Update props $(TZ=America/New_York date '+%Y-%m-%d %H:%M %Z')"
          git push
