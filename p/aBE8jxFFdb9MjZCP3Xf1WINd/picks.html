:root{
  --bg0:#020812;--bg1:#040c18;--bg2:#061020;
  --card:#102446;--card2:#0c1c38;--border:#305ca0;--glow:#1e468c;
  --white:#f8faff;--sub:#aab9cd;--muted:#8294aa;--track:#162a48;
  --green:#2ed682;--amber:#f5c446;--red:#e85460;
  --pill:#134a3c;--pillfg:#bff3da;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg0);color:var(--white);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-text-size-adjust:100%}
body{background:radial-gradient(1200px 600px at 70% -10%,#0b2144 0,transparent 60%),linear-gradient(var(--bg0),var(--bg1) 40%,var(--bg2));
  min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
.wrap{max-width:1280px;margin:0 auto;padding:20px 16px 48px}
header{text-align:center;padding:14px 0 6px}
.title{margin:0;line-height:.92;text-transform:uppercase;font-style:italic;font-weight:900;
  font-family:'SLTitle','Barlow Condensed','Arial Narrow','Roboto Condensed',Impact,sans-serif;letter-spacing:.5px;
  font-size:clamp(40px,8vw,76px)}

function lum(h){var n=parseInt(h.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255;return (0.299*r+0.587*g+0.114*b)/255}
function avStyle(c){var dark=lum(c.c1)<0.55;var bd=lum(c.c2)>0.15?c.c2:'#ffffff';
  return 'background:'+c.c1+';color:'+(dark?'#fff':'#0b1220')+';border-color:'+(lum(c.c1)<0.12?'#fff':bd)}
function ringCol(p){return p>=70?'var(--green)':(p>=50?'var(--amber)':'var(--red)')}
function ring(h,big){
  var p=h&&h.pct!=null?h.pct:null,r=big?36:26,C=2*Math.PI*r,sz=big?84:62,w=big?8:6;
  var off=p==null?C:C*(1-Math.min(100,Math.max(0,p))/100);
  return '<div class="ring'+(big?' lg':'')+'" aria-label="Hit rate '+(p==null?'unavailable':p+' percent')+'"><svg viewBox="0 0 '+sz+' '+sz+'"><circle cx="'+sz/2+'" cy="'+sz/2+'" r="'+r+'" fill="none" stroke="var(--track)" stroke-width="'+w+'"/>'+
   (p==null?'':'<circle cx="'+sz/2+'" cy="'+sz/2+'" r="'+r+'" fill="none" stroke="'+ringCol(p)+'" stroke-width="'+w+'" stroke-linecap="round" stroke-dasharray="'+C.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'"/>')+
   '</svg><div class="v"><b>'+(p==null?'&mdash;':p+'%')+'</b>'+(h&&h.window?'<i>'+esc(h.window)+'</i>':'')+'</div></div>'}
function matchup(c){
  var a=c.team||'';var o=c.opp||'';if(!o)return esc(a);
  return esc(a)+(c.home===true?' vs ':(c.home===false?' @ ':' / '))+esc(o)}
function dec(p){return p>0?1+p/100:1+100/Math.abs(p)}
function gradeBadge(c){return c.grade?'<span class="grade g-'+esc(c.grade[0])+'" title="Risk / payoff grade">'+esc(c.grade)+'</span>':'<span></span>'}
function cardHTML(c,i){
  return '<button class="card" type="button" data-i="'+i+'" aria-haspopup="dialog" aria-label="'+esc(c.player)+', '+esc(c.propLabel)+', '+esc(c.priceFmt)+'. Open details">'+
   '<div class="top"><span class="tier '+esc(c.tier)+'">'+esc(c.tierLabel)+'</span>'+gradeBadge(c)+'</div>'+
   '<div class="av" style="'+avStyle(c)+'">'+esc(c.ini)+(c.team?'<span class="tm">'+esc(c.team)+'</span>':'')+'</div>'+
   '<div class="nm">'+esc(c.player)+'</div><div class="pr">'+esc(c.propLabel)+'</div>'+
   '<div class="mu">'+matchup(c)+(c.startLabel?' &middot; '+esc(c.startLabel):'')+'</div>'+
   '<div class="low">'+ring(c.hit)+'<div class="px">'+esc(c.priceFmt)+(c.book?'<small>'+esc(c.book)+'</small>':'')+'</div>'+
   (c.conf!=null?'<div class="cf">'+c.conf+'<small>CONF</small></div>':'')+'</div></button>'}
function filtered(){
  var q=S.q.trim().toLowerCase();
  var a=D.cards.filter(function(c){
    if(S.sport!=='all'&&c.sport!==S.sport)return false;
    if(S.tier!=='all'&&c.tier!==S.tier)return false;
    if(q&&(c.player+' '+c.team+' '+c.opp+' '+c.market).toLowerCase().indexOf(q)<0)return false;
    return true});
  var by={
    conf:function(x,y){return (y.conf==null?-1:y.conf)-(x.conf==null?-1:x.conf)||x.tierRank-y.tierRank},
    hit:function(x,y){var hx=x.hit?x.hit.pct:-1,hy=y.hit?y.hit.pct:-1;return hy-hx||(y.conf||0)-(x.conf||0)},
    long:function(x,y){return dec(y.price)-dec(x.price)},
    short:function(x,y){return dec(x.price)-dec(y.price)},
    time:function(x,y){return String(x.startIso).localeCompare(String(y.startIso))||(y.conf||0)-(x.conf||0)}};
  return a.sort(by[S.sort]);
}
var VIEW=[];
function render(){
  VIEW=filtered();
  $('grid').innerHTML=VIEW.map(cardHTML).join('');
  $('empty').hidden=VIEW.length>0;
  $('count').textContent=VIEW.length+' pick'+(VIEW.length===1?'':'s');
}
function chips(){
  var n=D.cards.length;
  var h='<button class="chip" type="button" data-s="all" aria-pressed="'+(S.sport==='all')+'">All<b>'+n+'</b></button>';
  D.sports.forEach(function(s){h+='<button class="chip" type="button" data-s="'+esc(s.key)+'" aria-pressed="'+(S.sport===s.key)+'">'+esc(s.label)+'<b>'+s.n+'</b></button>'});
  $('sports').innerHTML=h;
  var tiers=[['all','All tiers'],['hc','90+ High Confidence'],['highlighted','Highlighted'],['lock','Locked'],['hot','Hot List'],['star','Star Watch'],['golden_source','Confirmed']];
  var base=D.cards.filter(function(c){return S.sport==='all'||c.sport===S.sport});
  var t='';tiers.forEach(function(x){var k=x[0],cnt=k==='all'?base.length:base.filter(function(c){return c.tier===k}).length;
    if(k!=='all'&&!cnt)return;
    t+='<button class="chip sm" type="button" data-t="'+k+'" aria-pressed="'+(S.tier===k)+'">'+x[1]+'<b>'+cnt+'</b></button>'});
  $('tiers').innerHTML=t;
}
/* ---------- detail sheet */
var cur=-1,lastFocus=null;
function sec(t,inner){return inner?'<section class="sec"><h3>'+t+'</h3>'+inner+'</section>':''}
function para(label,t){return t?'<p><b class="l">'+label+'</b>'+esc(t)+'</p>':''}
function sheetHTML(c){
  var R=c.r||{},h='';
  var title=(c.side==='under'?'Under ':(/anytime|1\+|2\+/i.test(c.marketRaw)?'':'Over '))+(/anytime|1\+|2\+/i.test(c.marketRaw)?c.market:c.line+' '+c.market);
  h+='<div class="sh-h"><button class="x" type="button" aria-label="Close details" id="xbtn">&times;</button><div class="av" style="'+avStyle(c)+'">'+esc(c.ini)+'</div><div><h2 id="sh-name">'+esc(c.player)+'</h2><p>'+matchup(c)+(c.startLabel?' &middot; '+esc(c.startLabel):'')+' &middot; '+esc(c.sportLabel)+'</p></div></div>'+
     '<div class="body">';
  h+='<div class="hero">'+ring(c.hit,true)+'<div class="big">'+esc(title)+'<small>'+(c.hit?esc(c.hit.window)+' '+esc(c.hit.label)+' hit rate':'')+(c.conf!=null?(c.hit?' &middot; ':'')+'Confidence '+c.conf:'')+'</small></div>'+
     '<div class="px">'+esc(c.priceFmt)+(c.book?'<small>'+esc(c.book)+'</small>':'')+'</div>'+(c.grade?'<div><span class="grade g-'+esc(c.grade[0])+'" style="font-size:20px;padding:6px 12px">'+esc(c.grade)+'</span>'+(c.gradeText?'<div class="note" style="max-width:130px;margin-top:4px">'+esc(c.gradeText)+'</div>':'')+'</div>':'')+'</div>';
  /* why it qualified */
  var why='<div class="tags" style="margin-bottom:10px"><span class="tier '+esc(c.tier)+'">'+esc(c.tierLabel)+'</span>'+c.sources.filter(function(s){return s!==titleCase(c.tierLabel)&&s.toUpperCase()!==c.tierLabel}).map(function(s){return '<span class="tag">Also: '+esc(s)+'</span>'}).join('')+(R.status?'<span class="tag">'+esc(R.status)+'</span>':'')+'</div>';
  var kv='';if(c.edge!=null)kv+='<div><small>Edge</small><b>'+(c.edge>0?'+':'')+c.edge+'%</b></div>';
  if(c.ev!=null)kv+='<div><small>Expected value</small><b>'+(c.ev>0?'+':'')+c.ev+'%</b></div>';
  if(c.fair!=null)kv+='<div><small>Model probability</small><b>'+c.fair+'%</b></div>';else if(c.est!=null)kv+='<div><small>Model estimate</small><b>'+c.est+'%</b></div>';
  if(c.conf!=null)kv+='<div><small>Confidence score</small><b>'+c.conf+'</b></div>';
  why+=(kv?'<div class="kv" style="margin-bottom:10px">'+kv+'</div>':'');
  why+=para('Tier',R.tier_text)+para('Headline',R.headline)+para('Calibration',R.calib_note);
  if(R.gates&&R.gates.length)why+='<div style="margin-top:6px">'+R.gates.map(function(g){return '<div class="chk"><i class="'+(g.ok?'p':'w')+'">'+(g.ok?'\u2713':'\u2013')+'</i><span>'+esc(g.k)+'</span></div>'}).join('')+'</div>';
  h+=sec('Why it qualified',why);
  /* reasoning */
  var rs=para('Setup',R.catalyst)+para('Situation',R.setup)+para('Matchup',R.matchup_text)+para('How it plays',R.exploit)+para('Game script',R.script)+para('Entry',R.entry)+para('Risk audit',R.risk_audit);
  if(R.bullets&&R.bullets.length)rs+='<ul>'+R.bullets.map(function(b){return '<li>'+esc(b)+'</li>'}).join('')+'</ul>';
  if(R.labels&&R.labels.length)rs+='<div class="tags" style="margin-top:8px">'+R.labels.map(function(b){return '<span class="tag">'+esc(b)+'</span>'}).join('')+'</div>';
  if(c.lineMoved)rs='<div class="tags" style="margin-bottom:10px"><span class="tag warn">Line moved since logged: '+c.lineMoved.logged+' &rarr; '+c.lineMoved.now+'. Reasoning below describes the current line.</span></div>'+rs;
  h+=sec('Reasoning',rs);
  if(R.checks&&R.checks.length)h+=sec('Checks',R.checks.map(function(k){var cl=k.st==='pass'?'p':(k.st==='fail'?'f':'w'),ic=k.st==='pass'?'\u2713':(k.st==='fail'?'\u2715':'!');
    return '<div class="chk"><i class="'+cl+'">'+ic+'</i><span>'+esc(k.k)+(k.v?'<em>'+esc(k.v)+'</em>':'')+'</span></div>'}).join(''));
  if(R.flags&&R.flags.length)h+=sec('Risk flags','<div class="tags">'+R.flags.map(function(f){return '<span class="tag warn">'+esc(f)+'</span>'}).join('')+'</div>');
  /* game log */
  var lg='';
  if(c.glog&&c.glog.length){
    var vals=c.glog.map(function(g){return g.v}),mx=Math.max.apply(null,vals.concat([c.line||0]))||1;
    var bars=c.glog.map(function(g){var hit=g.v>c.line;if(c.side==='under')hit=g.v<c.line;
      return '<div class="b" title="'+esc(g.d+' '+(g.at||'')+' '+(g.o||'')+': '+g.v)+'"><s>'+g.v+'</s><u style="height:'+Math.max(2,g.v/mx*100*0.78)+'%;background:'+(hit?'var(--green)':'var(--red)')+'"></u></div>'});
    var lines=c.glog.map(function(g){return '<div>'+esc(g.d)+'<br>'+esc((g.at==='@'?'@':'vs')+' '+(g.o||''))+'</div>'});
    lg='<div class="logs">'+bars.join('')+'<div class="ln" style="bottom:'+(c.line/mx*100*0.78)+'%"><em>'+c.line+'</em></div></div><div class="lbl">'+lines.join('')+'</div>';
    lg+='<p class="note" style="margin-top:8px">Last '+c.glog.length+' games before today, oldest to newest. Green cleared the line.</p>';
  }else if(c.series&&c.series.length){
    var mx2=Math.max.apply(null,c.series.concat([c.line||0]))||1;
    lg='<div class="logs">'+c.series.map(function(v){var hit=v>c.line;return '<div class="b"><s>'+v+'</s><u style="height:'+Math.max(2,v/mx2*100*0.78)+'%;background:'+(hit?'var(--green)':'var(--red)')+'"></u></div>'}).join('')+'<div class="ln" style="bottom:'+(c.line/mx2*100*0.78)+'%"><em>'+c.line+'</em></div></div>';
  }
  var wk='';Object.keys(c.windows||{}).forEach(function(k){var w=c.windows[k];wk+='<div><small>'+esc(k)+'</small><b>'+esc(w.label)+' &middot; '+w.pct+'%</b></div>'});
  Object.keys(c.stats||{}).forEach(function(k){wk+='<div><small>'+esc(k)+'</small><b>'+esc(c.stats[k])+'</b></div>'});
  h+=sec('Recent games',lg+(wk?'<div class="kv" style="margin-top:10px">'+wk+'</div>':''));
  /* matchup */
  var m=c.matchup||{},mt='';
  if(m.vector)mt+='<p>'+esc(m.vector)+'</p>';if(m.window)mt+='<p class="k">'+esc(m.window)+'</p>';if(m.env)mt+='<p class="k">'+esc(m.env)+'</p>';
  h+=sec('Matchup',mt);
  /* injuries */
  var ij='';if(c.workload)ij+='<p>'+esc(c.workload)+'</p>';if(c.cascade)ij+='<p>'+esc(c.cascade)+'</p>';
  if(c.inj&&c.inj.length)ij+='<div class="inj">'+c.inj.map(function(i){return '<div><b>'+esc(i.name)+'</b>'+(i.status?' &middot; <span class="st">'+esc(i.status)+'</span>':'')+
    ((i.reason||i.without||i.with)?'<small>'+[i.reason,i.without?'Without him: '+i.without:'',i.with?'With him: '+i.with:''].filter(Boolean).map(esc).join(' &middot; ')+'</small>':'')+'</div>'}).join('')+'</div>';
  h+=sec('Injury & lineup context',ij);
  /* line movement */
  var mv=c.move||{},lm='';
  if(c.lineMoved)lm+='<p><b>Logged at '+c.lineMoved.logged+' ('+esc(c.priceFmt)+'). The current board line is '+c.lineMoved.now+(c.lineMoved.nowPrice?' at '+esc(c.lineMoved.nowPrice):'')+'.</b> Edge numbers and reasoning on this card describe the current line.</p>';
  if(mv.open!=null)lm+='<p>Line moved '+mv.open+' &rarr; '+mv.now+'</p>';if(mv.signal&&!(mv.open!=null&&mv.signal.indexOf('->')>-1))lm+='<p class="k">'+esc(mv.signal)+'</p>';
  if(mv.class)lm+='<p class="k">Movement read: '+esc(mv.class)+'</p>';
  if(mv.books)lm+='<div class="kv">'+Object.keys(mv.books).map(function(b){return '<div><small>'+esc(b)+'</small><b>'+esc(mv.books[b])+'</b></div>'}).join('')+'</div>';
  h+=sec('Line & price',lm);
  h+='<p class="note">Reasoning shown is what the model logged for this prop. Anything the model did not log is left out.</p></div>'+
     '<div class="navr"><button class="nav" type="button" id="prv">&larr; Previous</button><button class="nav" type="button" id="nxt">Next &rarr;</button></div>'+
     '<div class="close-wrap"><button class="close-bot" type="button" id="cbtn" aria-label="Close details">Close</button></div>';
  return h}
function titleCase(s){return String(s).toLowerCase().replace(/\b\w/g,function(m){return m.toUpperCase()})}
var lockY=0;
function openSheet(i){
  cur=i;var c=VIEW[i];if(!c)return;
  $('sheet').innerHTML=sheetHTML(c);$('ov').classList.add('on');$('ov').setAttribute('aria-hidden','false');
  lockY=window.scrollY||document.documentElement.scrollTop||0;
  document.body.style.overflow='hidden';document.body.style.position='fixed';document.body.style.width='100%';document.body.style.top='-'+lockY+'px';
  $('sheet').scrollTop=0;
  $('xbtn').onclick=closeSheet;$('cbtn').onclick=closeSheet;$('prv').onclick=function(){go(-1)};$('nxt').onclick=function(){go(1)};
  $('xbtn').focus();
  if(history.replaceState)history.replaceState(null,'','#'+c.id);
}
function go(d){var n=cur+d;if(n<0||n>=VIEW.length)return;openSheet(n)}
function closeSheet(){$('ov').classList.remove('on');$('ov').setAttribute('aria-hidden','true');
  document.body.style.overflow='';document.body.style.position='';document.body.style.width='';document.body.style.top='';
  window.scrollTo(0,lockY);
  if(history.replaceState)history.replaceState(null,'',location.pathname+location.search);
  if(lastFocus&&lastFocus.focus)lastFocus.focus()}
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-s],[data-t],.card');
  if(e.target===$('ov')){closeSheet();return}
  if(!t)return;
  if(t.hasAttribute('data-s')){S.sport=t.getAttribute('data-s');S.tier='all';chips();render();return}
  if(t.hasAttribute('data-t')){S.tier=t.getAttribute('data-t');chips();render();return}
  if(t.classList.contains('card')){lastFocus=t;openSheet(+t.getAttribute('data-i'))}
});
document.addEventListener('keydown',function(e){
  if(!$('ov').classList.contains('on'))return;
  if(e.key==='Escape')closeSheet();
  else if(e.key==='ArrowRight')go(1);else if(e.key==='ArrowLeft')go(-1);
  else if(e.key==='Tab'){var f=$('sheet').querySelectorAll('button');if(!f.length)return;var a=f[0],z=f[f.length-1];
    if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}
});
$('sort').addEventListener('change',function(){S.sort=this.value;render()});
$('q').addEventListener('input',function(){S.q=this.value;render()});
$('sub').textContent=D.dateLabel+'  \u2022  '+D.cards.length+' priced pre-game picks'+(D.generatedLabel?'  \u2022  built '+D.generatedLabel+(D.window?' ('+D.window+' refresh)':''):'');
try{var td=new Intl.DateTimeFormat('en-CA',{timeZone:'America/New_York'}).format(new Date());
  if(td!==D.date){var b=document.createElement('div');b.setAttribute('role','status');
    b.style.cssText='background:#3a1c22;border:1px solid #7a2f3c;color:#ffc9d0;border-radius:12px;padding:10px 14px;margin:0 0 14px;font-size:14px;text-align:center';
    b.textContent='This board is from '+D.dateLabel+' and has not refreshed for today yet. Check back after the next refresh.';
    document.querySelector('main').insertBefore(b,$('grid'))}}catch(e){}
chips();render();
var hid=decodeURIComponent((location.hash||'').slice(1));
if(hid){var ix=VIEW.findIndex(function(c){return c.id===hid});if(ix>-1)openSheet(ix)}
})();
</script>
</body>
</html>
