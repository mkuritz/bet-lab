<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Results · Bet Lab</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
<style>
:root{--bg:#0b0f17;--panel:#121826;--panel2:#182033;--line:#243049;--txt:#e6ebf5;--mut:#8b97b0;--acc:#53e3a6;--acc2:#3fa9ff;--bad:#ff5d6c;--mid:#f5c451}
[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
html,body{overflow-x:hidden;max-width:100%}
header{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,#0f1524,#0b0f17);flex-wrap:wrap}
.logo{font-weight:800;font-size:20px}.logo b{color:var(--acc)}header a{color:var(--mut);font-weight:700;text-decoration:none;font-size:13px}
main{padding:16px 20px;max-width:1150px;margin:0 auto}h2{font-size:16px;margin:22px 0 8px}.mut{color:var(--mut)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}.kpi b{display:block;font-size:22px}.kpi small{color:var(--mut);font-size:11px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:10px;min-width:0}
.warnbox{background:#f5c45114;border:1px solid #f5c45155;color:var(--mid);border-radius:10px;padding:10px 12px;font-size:13px;margin-top:10px}
.wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}table{width:100%;border-collapse:collapse;font-size:13px}th{color:var(--mut);font-size:11px;text-transform:uppercase;text-align:left;padding:8px;background:var(--panel2);white-space:nowrap}td{padding:8px;border-top:1px solid var(--line);white-space:nowrap}
.g{color:var(--acc)}.r{color:var(--bad)}.y{color:var(--mid)}
.pill{font-size:10px;font-weight:800;padding:2px 7px;border-radius:999px;white-space:nowrap}.p-proven{background:#53e3a622;color:var(--acc)}.p-losing{background:#ff5d6c22;color:var(--bad)}.p-unproven{background:#8b97b022;color:var(--mut)}.p-star{background:#53e3a6;color:#06210f}.p-fun{background:#f5c45122;color:var(--mid)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chips select,.chips input{background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:6px 8px;border-radius:8px;max-width:100%}
.cal{width:100%;max-width:520px;display:block}
footer{color:var(--mut);font-size:12px;padding:16px 20px 30px;border-top:1px solid var(--line);margin-top:30px}footer a{color:inherit}
@media(max-width:600px){main{padding:12px 10px}.kpi b{font-size:18px}}
</style><link rel="stylesheet" href="nav.css"><script src="https://sportslabshq.com/sl/sl.js?v=7" defer></script>
</head><body><header><div class="logo">🎯 Bet Lab <b>Results</b></div></header>
<main>
<p class="mut" style="margin-top:0">Every official pick is posted before the game starts. Losses stay on the board.</p>
<div class="kpis" id="k"></div>
<h2>Today's picks</h2><div class="card" id="tp"><span class="mut">Loading…</span></div>
<h2>✅ Recent results</h2><div class="card" data-sl-public id="rr"><span class="mut">Loading…</span></div>
</main>
<footer>21+. Not betting advice. Gambling problem? Call 1-800-GAMBLER. · <a href="./index.html">Back to Bet Lab</a></footer>
<script>
(async()=>{const E=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])),A=o=>o==null?"":(o>0?"+":"")+o;
const T=await fetch("data/todays_edge.json?v="+Date.now()).then(r=>r.ok?r.json():{}).catch(()=>({})),R=T.results||{wins:0,losses:0,units:0,recent:[]};
document.getElementById("k").innerHTML=`<div class="kpi"><b>${R.wins}-${R.losses}</b><small>Official record</small></div><div class="kpi"><b>${R.units>=0?"+":""}${R.units}u</b><small>Units, flat 1u</small></div>`+(T.improved||[]).map(i=>`<div class="kpi"><b style="font-size:15px">📈 ${E(i.head)}</b><small>${E(i.why)}</small></div>`).join("");
const P=(T.plays||[]).slice(0,5);
document.getElementById("tp").innerHTML=P.length?P.map(p=>`<div style="display:flex;gap:8px;padding:7px 0;border-top:1px solid var(--line)"><span style="flex:1">${p.official?"🎯 ":""}${E(p.title)}</span><b>${A(p.price)}</b></div>`).join(""):'<span class="mut">No picks clear our bar yet today.</span>';
document.getElementById("rr").innerHTML=(R.recent||[]).length?R.recent.map(r=>`<div style="padding:7px 0;border-top:1px solid var(--line)">${r.result=="win"?"✅":"❌"} ${E(r.title)} <span class="mut">${A(r.price)}</span></div>`).join(""):'<span class="mut">First results are grading now.</span>';})();
</script><script src="nav.js"></script></body></html>
